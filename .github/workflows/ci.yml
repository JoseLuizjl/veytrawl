name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Allow Chromium sandbox namespaces on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          task_browser_cache="$(node -e "const {chromium}=require('playwright');const {dirname}=require('node:path');process.stdout.write(dirname(dirname(dirname(chromium.executablePath()))))")"
          task_profile="$(mktemp)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n' > "$task_profile"
          task_index=0
          for task_browser in "$task_browser_cache"/chromium-*/chrome-linux64/chrome "$task_browser_cache"/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell; do
            test -x "$task_browser"
            task_index=$((task_index + 1))
            printf 'profile veytrawl-ci-%s "%s" flags=(unconfined) { userns, }\n' "$task_index" "$task_browser" >> "$task_profile"
          done
          sudo apparmor_parser -r "$task_profile"
          rm "$task_profile"
      - run: npm run check
      - run: npm run format:check
      - run: npm run verify:source
      - run: node --test scripts/verify-publishing.mjs
      - run: npm audit
      - run: npm test
      - run: npm run verify:package
  bun:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install chromium
      - run: npm run test:bun
